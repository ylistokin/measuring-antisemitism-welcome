name: Reproduce Figures 1–3

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Figure 1
        run: |
          python figure1/scripts/make_figure1.py
          git diff --exit-code -- figure1/outputs/*.csv
      - name: Figure 2
        run: |
          python figure2/scripts/build_figure2.py
          python -m unittest discover -s figure2/tests -v
          python figure2/scripts/reproduce_figure2.py
      - name: Figure 3
        run: python figure3/scripts/make_figure3.py
      - uses: actions/upload-artifact@v4
        with:
          name: figures
          path: |
            figure1/outputs/
            figure2/outputs/
            figure3/outputs/
